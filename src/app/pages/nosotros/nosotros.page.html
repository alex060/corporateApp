<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Nosotros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Nuestra empresa</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Empresa especializada en soluciones basadas en Angular, Ionic y Node.js.</p>

      <div *ngIf="cargando" style="margin-top: 15px;">
        <ion-spinner name="crescent"></ion-spinner> Obteniendo tu ubicación...
      </div>

      <div *ngIf="distancia !== null" style="margin-top: 15px;">
        <p><strong>Distancia a nuestras oficinas:</strong></p>
        <h2 style="color: var(--ion-color-primary); font-weight: bold;">{{ distancia }} km</h2>
        <p><small>Sede: Calle Arcos de Jalón 18, Madrid</small></p>
      </div>

      <p *ngIf="errorMsg" style="color: var(--ion-color-danger); margin-top: 15px;">
        {{ errorMsg }}
      </p>
    </ion-card-content>
  </ion-card>
</ion-content>
